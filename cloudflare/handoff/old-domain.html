<!doctype html>
<!--
  Goes live on the OLD address (66.broscafe.hu, the Coolify app) at the switchover, in place of the app,
  served for every path. Packs the player's local data (all "sixtysix.*" localStorage entries: progress,
  settings, login token, offline rewards) into the URL fragment and forwards to the new address,
  keeping the path (/join/CODE …). The fragment never leaves the browser; app/index.html imports it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>66 has moved</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1d120b;color:#f3e3c3;font:18px/1.5 system-ui,sans-serif;text-align:center;padding:24px}a{color:#ffcf6b}</style>
</head>
<body>
<p>66 has moved to <a id="go" href="https://66.gracelabs.dev/">66.gracelabs.dev</a>. Taking you there…</p>
<script>
(function () {
  var NEW = 'https://66.gracelabs.dev'
  var target = NEW + location.pathname + location.search
  try {
    var data = {}
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i)
      if (k && k.indexOf('sixtysix.') === 0) data[k] = localStorage.getItem(k)
    }
    if (Object.keys(data).length) {
      var bytes = new TextEncoder().encode(JSON.stringify(data))
      var bin = ''
      for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j])
      target += '#handoff=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
    }
  } catch (e) {}
  document.getElementById('go').href = target
  location.replace(target)
})()
</script>
</body>
</html>
